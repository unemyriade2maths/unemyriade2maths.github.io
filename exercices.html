<html lang="fr">

</head>
<body>
<header class="entete">
  <div class="page" style="padding-bottom:0">
    <a id="retour" href="chapitre.html">← Le chapitre</a>
    <small id="niv">EXERCICES</small>
    <h1 id="titre"></h1>
  </div>
</header>
<div class="page zone-exos" id="zone">
  <div class="barre-rub" id="barre" hidden><button class="btn retour-som" id="retourSom">← Sommaire</button><h2 id="nomRub"></h2></div>
  <div id="liste"></div>
</div>
<script src="assets/data.js"></script>

<script>
const P = new URLSearchParams(location.search), cid = P.get('c') || 'arithmetique', pid = P.get('p') || '1';
const E = EXOS[cid][pid];
const $ = (x) => document.getElementById(x);
$('titre').textContent = 'Partie ' + pid + ' · ' + E.titre; $('niv').textContent = chapitre(cid).titre.toUpperCase() + ' · ' + chapitre(cid).niveau;
$('retour').href = 'chapitre.html?c=' + cid;
document.title = 'Exercices – ' + E.titre;
const son = new Audio();
const jouer = (t) => { const f = AUDIO[t]; if (!f) return; son.pause(); son.src = 'audio/' + f; son.play().catch(() => {}); };
const btnSon = (t) => AUDIO[t] ? `<button class="mini-son" data-v="${encodeURIComponent(t)}" aria-label="Écouter">🔊</button>` : '';
const norm = (s) => s.normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/\s+/g, '').replace(/[*]/g, '×').replace(/(\d)x(\d)/gi, '$1×$2').replace(/\^2/g, '²').replace(/\^3/g, '³').replace(/\./g, ',').toLowerCase();
// une égalité de Pythagore : PN = NP, les deux carrés de droite dans n'importe quel ordre, 2 ou ² ou ^2.
// Mais on commence par l'hypoténuse (membre de gauche imposé), et un sommet s'écrit en majuscule.
const canon = (x) => {
  let t = norm(x).replace(/[\[\]]/g, '');
  if (/^[a-z]{2}$/.test(t)) return t.split('').sort().join('');
  if (t.includes('=') && /^[a-z0-9²,+=−√-]+$/.test(t)) {
    t = t.replace(/([a-z]{2})2(?=[+=−-]|$)/g, '$1²');
    return t.split('=').map(m => m.split('+').map(u => u.replace(/^([a-z])([a-z])²$/, (q, a, b) => [a, b].sort().join('') + '²')).sort().join('+')).join('=');
  }
  return t;
};
// 'ok', 'faux', ou { rappel } : un rappel de convention ne compte pas comme une erreur
const juger = (reps, val) => {
  const v = String(val || '').trim(), bon = (x) => reps.some(r => canon(r) === canon(x));
  const inverse = v.includes('=') ? v.split('=').reverse().join('=') : null;
  const juste = bon(v), retourne = !juste && inverse && bon(inverse);
  if ((juste || retourne) && reps.some(r => /[A-Z]/.test(r) && /^[\[\]A-Z²=+−\s]+$/.test(r))) {   // seulement pour des noms de points
    const m = v.replace(/\bc?m\b/g, '').match(/[a-z]/);
    if (m) return { rappel: `Attention à la convention : un point se nomme avec une lettre majuscule. Écris « ${m[0].toUpperCase()} » et non « ${m[0]} ».` };
  }
  if (juste) return 'ok';
  if (retourne) return { rappel: `On commence toujours par l’hypoténuse : écris d’abord « ${reps[0].split('=')[0]} = … ».` };
  return 'faux';
};
const rendu = (h) => typeof h === 'string' ? h : potence(...h.pot) + (h.apres || '');

const pasHtml = (et, pi) => {
  let h = '';
  for (let j = 0; j <= pi; j++) {
    const x = et[j].h;
    if (et[j].r && j < pi && et.slice(j + 1, pi + 1).some(e => e.r)) continue;
    if (et[j].q && (j === 0 || et[j - 1].q !== et[j].q)) h += `<p class="q-titre">Question ${et[j].q})</p>`;
    if (typeof x === 'string') h += `<div class="etape${j === pi ? ' nouvelle' : ''}">${x}</div>`;
    else if (j === pi || typeof et[j + 1].h === 'string') h += `<div class="etape pot">${rendu(x)}</div>`;
  }
  return h;
};
// le bouton dit ce qui vient : « Question b) ▶ » quand on change de question, sinon « Suite ▶ »
const labelSuiv = (b, et, pi) => {
  const fin = pi >= et.length - 1; b.disabled = fin;
  b.textContent = fin ? 'Correction terminée' : (et[pi + 1].q && et[pi + 1].q !== et[pi].q ? `Question ${et[pi + 1].q}) ▶` : 'Suite ▶');
  const reste = et.length - 1 - pi, c = b.closest('.pas-barre').previousElementSibling;
  if (c && c.classList.contains('pas-cpt')) c.textContent = fin ? `Correction complète ✓ (${et.length} étapes)` : `Étape ${pi + 1} / ${et.length} · encore ${reste} clic${reste > 1 ? 's' : ''} pour la correction complète`;
};
const carte = (it, n) => {
  if (it.type === 'lecon') return `<div class="item" id="ex${n}">
      ${it.parties.length > 1 ? `<div class="choix-lecon">${it.parties.map((l, j) => `<button class="opt${j ? '' : ' choisi'}" data-l="${l}"><span class="lettre">${LECONS[cid][l].lettre || l}</span> ${LECONS[cid][l].titre}</button>`).join('')}</div>` : ''}
      <div class="lecteur-lecon"></div>
      <details class="revoir video-partie"><summary>▶ Voir la vidéo de cette partie</summary><div class="lecteur"></div></details></div>`;
  if (it.type === 'tableau') return `<div class="item" id="ex${n}"><h3 class="exo-titre">${it.titre} <span class="ceinture">Ceinture ${it.ceinture}</span> <span class="essai-num"></span></h3>
    <div class="enonce"><p><strong>On considère le nombre <span class="nn"></span>.</strong></p>
      <p><span class="q">a)</span> Décompose <span class="nn"></span> en produit de facteurs premiers.</p>
      <p><span class="q">b)</span> Complète le tableau des diviseurs.</p>
      <p><span class="q">c)</span> Écris tous les diviseurs de <span class="nn"></span> dans l’ordre croissant.</p></div>
    <div class="questions">
      <div class="question" data-touches="× ² ³"><label class="lab" for="t${n}a"><span class="q">a)</span> <span class="nn"></span> =</label><input id="t${n}a" type="text" autocomplete="off" placeholder="ex. : 2 × 3²"></div>
      <div class="question"><p class="lab"><span class="q">b)</span> Le tableau</p><div class="grille t-grille"></div></div>
      <div class="question" data-touches=";"><label class="lab" for="t${n}c"><span class="q">c)</span> Les diviseurs de <span class="nn"></span> :</label><input id="t${n}c" type="text" autocomplete="off" inputmode="numeric" placeholder="ex. : 1 ; 2 ; …"></div></div>
    <div class="indices"></div>
    <div class="boutons"><button class="btn indice-b"></button><button class="btn verif">Vérifier</button></div>
    <div class="verdict" hidden></div>
    <div class="correction" hidden><h3>Correction</h3><div class="pas"></div><p class="pas-cpt"></p>
      <div class="pas-barre"><button class="btn verif pas-suiv">Suite ▶</button></div>
      <p class="cc fin-cc" hidden></p></div>
    <button class="btn essai t-essai" hidden></button></div>`;
  if (it.type === 'lien') return `<div class="item"><h3 class="exo-titre">${it.titre}</h3><a class="ligne" href="${it.page}"><span>${it.texte}</span><span class="fl">→</span></a></div>`;
  if (it.type === 'methode') return `<div class="item" id="ex${n}"><h3 class="exo-titre">${it.titre}</h3><div class="methode">${it.resume}
      <div class="pas"></div><p class="pas-cpt"></p><div class="pas-barre"><button class="btn verif pas-suiv">Suite ▶</button><button class="btn son pas-son">🔊 Écouter</button></div>
      <p class="cc" hidden>${it.cc}</p></div></div>`;
  if (it.type === 'flash') return `<div class="item flash" id="ex${n}"><p class="consigne">${it.consigne}</p>
      <div class="flash-carte"><div class="flash-num"></div><p class="flash-q"></p><div class="chrono"><span></span></div>
      <div class="vf"><button class="btn vrai">Vrai</button><button class="btn faux">Faux</button></div>
      <div class="flash-rep" hidden></div><button class="btn essai flash-go">Commencer</button></div></div>`;
  if (it.type === 'guide') return `<div class="item" id="ex${n}"><h3 class="exo-titre">${it.titre}</h3>
      <div class="enonce">${btnSon(it.v)}${it.enonce}</div>
      <div class="guide-pot"></div><div class="guide-actuelle"></div>
      <div class="guide-faites" hidden><p class="g-titre">Déjà fait</p></div>
      <p class="cc" hidden>${it.cc}</p></div>`;
  return `<div class="item" id="ex${n}"><h3 class="exo-titre">${it.titre}${it.ceinture ? ` <span class="ceinture">Ceinture ${it.ceinture}</span>` : ''}</h3>
    <div class="enonce">${btnSon(it.v)}${it.enonce}</div>
    <div class="questions">${it.champs.map((c, k) => c.choix
      ? `<div class="question" data-k="${k}"><span class="lab">${c.q ? `<span class="q">${c.q})</span> ` : ''}${c.lab}</span><div class="choix">${c.choix.map(o => `<button class="opt" data-o="${o}">${o}</button>`).join('')}</div></div>`
      : `<div class="question" data-k="${k}" data-touches="${(c.touches || []).join(' ')}"><label class="lab" for="c${n}_${k}">${c.q ? `<span class="q">${c.q})</span> ` : ''}${c.lab}</label>
         <input type="text" id="c${n}_${k}" class="${c.court ? 'court' : ''}" autocomplete="off" ${c.touches ? '' : 'inputmode="numeric"'} placeholder="${c.place || ''}"></div>`).join('')}</div>
    <div class="indices"></div>
    ${it.aide ? `<button class="btn aide-b">${it.aide.bouton}</button><div class="aide" hidden>${it.aide.html}</div>` : ''}
    <div class="boutons"><button class="btn indice-b">💡 Indice (1/${it.indices.length})</button><button class="btn verif">Vérifier</button></div>
    <div class="verdict" hidden></div>
    <div class="correction" hidden><h3>Correction</h3><div class="pas"></div>
      <p class="pas-cpt"></p><div class="pas-barre"><button class="btn verif pas-suiv">Suite ▶</button><button class="btn son pas-son">🔊 Écouter</button></div>
      <p class="cc" hidden>${it.cc}</p></div></div>`;
};
let html = '', som = '';
RUBRIQUES.forEach(([r, nom, ico]) => {
  const its = E.items.map((it, n) => [it, n]).filter(([it]) => it.rub === r);
  if (!its.length) return;
  som += `<button role="tab" data-r="${r}" aria-selected="false"><span aria-hidden="true">${ico}</span> ${nom}</button>`;
  html += `<section class="rubrique" id="r-${r}"><h2 class="rub-titre"><span class="rub-ico" aria-hidden="true">${ico}</span>${nom}</h2>${its.map(([it, n]) => carte(it, n)).join('')}</section>`;
});
const DESC = { lecon: 'Les diapos clic par clic, avec la voix', methode: 'La méthode pas à pas, sur un exemple', flash: 'Vrai ou faux, en quelques secondes',
  guide: 'Un exercice court, étape par étape', exo: 'Seul, avec des indices si besoin', scratch: 'Que fait le programme ?', calc: 'Les touches de ta calculatrice', tableur: 'Qu’affiche le tableur ?' };
const menu = RUBRIQUES.filter(([r]) => E.items.some(it => it.rub === r)).map(([r, nom, ico]) =>
  `<button class="carte-rub" data-r="${r}"><span class="rub-ico" aria-hidden="true">${ico}</span><span class="txt"><strong>${nom}</strong><small>${DESC[r] || ''}</small></span></button>`).join('');
html = `<section class="rubrique" id="r-menu"><p class="consigne">Que veux-tu travailler ? Choisis dans l’ordre que tu veux.</p><div class="grille-rub">${menu}</div></section>` + html;
$('liste').innerHTML = html;

document.querySelectorAll('.mini-son').forEach(b => b.onclick = () => jouer(decodeURIComponent(b.dataset.v)));

// --- questions flash
E.items.forEach((it, n) => {
  if (it.type !== 'flash') return;
  const S = $('ex' + n), q = S.querySelector('.flash-q'), num = S.querySelector('.flash-num'), rep = S.querySelector('.flash-rep');
  const barre = S.querySelector('.chrono span'), go = S.querySelector('.flash-go'), vf = S.querySelector('.vf');
  let i = -1, t = null, score = 0;
  vf.hidden = true; S.querySelector('.chrono').hidden = true;
  const repondre = (r) => {
    clearTimeout(t); vf.hidden = true; barre.style.transition = 'none';
    const Q = it.questions[i], bon = r === Q.rep; if (bon) score++;
    rep.hidden = false; rep.className = 'flash-rep ' + (bon ? 'ok' : 'non');
    rep.innerHTML = `<strong>${r === null ? 'Temps écoulé !' : (bon ? 'Bravo !' : 'Pas tout à fait.')}</strong> C’est ${Q.rep ? 'vrai' : 'faux'} : ${Q.expl}`;
    go.hidden = false; go.textContent = i < it.questions.length - 1 ? 'Question suivante' : 'Voir mon score';
  };
  const suivante = () => {
    i++;
    if (i >= it.questions.length) {
      num.textContent = ''; q.textContent = `Ton score : ${score} / ${it.questions.length}`; rep.hidden = true; vf.hidden = true;
      S.querySelector('.chrono').hidden = true; go.textContent = 'Recommencer'; i = -1; score = 0; return;
    }
    const Q = it.questions[i]; num.textContent = `Question ${i + 1} / ${it.questions.length}`; q.textContent = Q.q;
    rep.hidden = true; vf.hidden = false; go.hidden = true; S.querySelector('.chrono').hidden = false;
    barre.style.transition = 'none'; barre.style.width = '100%'; void barre.offsetWidth;
    barre.style.transition = `width ${it.duree}s linear`; barre.style.width = '0%';
    t = setTimeout(() => repondre(null), it.duree * 1000);
    jouer(Q.v || dire(Q.q));
  };
  go.onclick = suivante;
  S.querySelector('.vrai').onclick = () => repondre(true);
  S.querySelector('.faux').onclick = () => repondre(false);
});

// --- exercices
E.items.forEach((it, n) => {
  if (it.type !== 'exo') return;
  const S = $('ex' + n); let ni = 0, pi = 0;
  S.querySelectorAll('.choix').forEach(g => g.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    g.querySelectorAll('.opt').forEach(x => x.classList.remove('choisi')); o.classList.add('choisi');
  }));
  const bi = S.querySelector('.indice-b');
  bi.onclick = () => {
    if (ni >= it.indices.length) return;
    S.querySelector('.indices').insertAdjacentHTML('beforeend', `<div class="indice"><small>Indice ${ni + 1}</small>${it.indices[ni]}</div>`);
    ni++; bi.textContent = ni < it.indices.length ? `💡 Indice (${ni + 1}/${it.indices.length})` : '💡 Plus d’indice'; bi.disabled = ni >= it.indices.length;
  };
  const ab = S.querySelector('.aide-b');
  if (ab) ab.onclick = () => { const a = S.querySelector('.aide'); a.hidden = !a.hidden; };
  const C = S.querySelector('.correction'), pas = S.querySelector('.pas'), ps = S.querySelector('.pas-suiv');
  const montrer = () => {
    const et = it.correction;
    pas.innerHTML = pasHtml(et, pi); labelSuiv(ps, et, pi);
    S.querySelector('.cc').hidden = pi < et.length - 1;
  };
  ps.onclick = () => { if (pi < it.correction.length - 1) { pi++; montrer(); jouer(voixDe(it.correction[pi])); } };
  S.querySelector('.pas-son').onclick = () => jouer(voixDe(it.correction[pi]));
  S.querySelector('.verif').onclick = () => {
    let bons = 0, rappels = 0;
    S.querySelectorAll('.g-rappel').forEach(x => x.remove());
    const res = it.champs.map((c, k) => {
      const Q = S.querySelector(`.question[data-k="${k}"]`);
      if (c.choix) { const o = Q.querySelector('.opt.choisi'); return o && o.dataset.o === c.rep ? 'ok' : 'faux'; }
      return juger(c.rep, Q.querySelector('input').value);
    });
    // un rappel de convention : on le montre sous la réponse, et on laisse l'élève corriger avant de vérifier
    res.forEach((r, k) => { if (r.rappel) { rappels++; S.querySelector(`.question[data-k="${k}"]`).insertAdjacentHTML('beforeend', `<p class="g-rappel">${r.rappel}</p>`); } });
    if (rappels) return;
    res.forEach((r, k) => { const Q = S.querySelector(`.question[data-k="${k}"]`), ok = r === 'ok'; Q.classList.toggle('juste', ok); Q.classList.toggle('faux', !ok); if (ok) bons++; });
    const V = S.querySelector('.verdict'); V.hidden = false;
    const tout = bons === it.champs.length;
    V.className = 'verdict ' + (tout ? 'ok' : 'non');
    V.textContent = tout ? 'Bravo, tout est juste ! Regarde la correction pas à pas.' : `${bons} réponse${bons > 1 ? 's' : ''} juste${bons > 1 ? 's' : ''} sur ${it.champs.length}. Regarde la correction pas à pas.`;
    if (C.hidden) { C.hidden = false; pi = 0; montrer(); jouer(voixDe(it.correction[0])); }
  };
});

// --- exercice du tableau des diviseurs, avec « Nouvel essai » (autres nombres)
E.items.forEach((it, n) => {
  if (it.type !== 'tableau') return;
  const S = $('ex' + n), V = it.variantes, SUP = ['⁰', '¹', '²', '³'];
  const g = S.querySelector('.t-grille'), C = S.querySelector('.correction'), pas = S.querySelector('.pas'), ps = S.querySelector('.pas-suiv'), bi = S.querySelector('.indice-b');
  let i = 0, ni = 0, pi = 0, et = [];
  const tab = (v, sol) => {
    let h = `<div class="grille" style="grid-template-columns:repeat(${v.b[1] + 2}, minmax(0, 1fr))"><div class="h-lig">×</div>`;
    for (let j = 0; j <= v.b[1]; j++) h += `<div class="h-col">${v.b[0]}${SUP[j]}</div>`;
    for (let r = 0; r <= v.a[1]; r++) {
      h += `<div class="h-lig">${v.a[0]}${SUP[r]}</div>`;
      for (let j = 0; j <= v.b[1]; j++) { const x = v.a[0] ** r * v.b[0] ** j; h += sol ? `<div class="c-sol">${x}</div>` : `<input type="text" inputmode="numeric" data-x="${x}" aria-label="case ${v.a[0]}${SUP[r]} × ${v.b[0]}${SUP[j]}">`; }
    }
    return h + '</div>';
  };
  const indices = (v) => [`Pour décomposer ${v.n}, utilise les divisions successives : divise uniquement par des nombres premiers.`,
    `Les lignes du tableau sont les puissances de ${v.a[0]}, les colonnes celles de ${v.b[0]}. Rappel : un nombre puissance 0 vaut 1.`,
    'Chaque case = ligne × colonne. Pour la question c, range tous les nombres du tableau du plus petit au plus grand.'];
  const majIndice = () => { const H = indices(V[i]); bi.textContent = ni >= H.length ? '💡 Plus d’indice' : `💡 Indice (${ni + 1}/${H.length})`; bi.disabled = ni >= H.length; };
  const charger = () => {
    const v = V[i]; ni = 0;
    S.querySelectorAll('.nn').forEach(e => e.textContent = v.n);
    S.querySelector('.essai-num').textContent = `Essai ${i + 1} / ${V.length}`;
    S.querySelectorAll('.questions input').forEach(x => x.value = '');
    S.querySelectorAll('.question').forEach(x => x.classList.remove('juste', 'faux'));
    g.innerHTML = tab(v, false).replace(/^<div class="grille"[^>]*>|<\/div>$/g, ''); g.style.gridTemplateColumns = `repeat(${v.b[1] + 2}, minmax(0, 1fr))`;
    S.querySelector('.indices').innerHTML = ''; S.querySelector('.verdict').hidden = true; C.hidden = true; S.querySelector('.t-essai').hidden = true;
    majIndice();
  };
  bi.onclick = () => { const H = indices(V[i]); if (ni >= H.length) return; S.querySelector('.indices').insertAdjacentHTML('beforeend', `<div class="indice"><small>Indice ${ni + 1}</small>${H[ni]}</div>`); ni++; majIndice(); };
  const montrer = () => { pas.innerHTML = pasHtml(et, pi); labelSuiv(ps, et, pi); S.querySelector('.fin-cc').hidden = pi < et.length - 1; };
  ps.onclick = () => { if (pi < et.length - 1) { pi++; montrer(); } };
  S.querySelector('.verif').onclick = () => {
    const v = V[i], Q = S.querySelectorAll('.question');
    const nrm = x => x.replace(/\s/g, '').replace(/[x*]/g, '×').replace(/\^2/g, '²').replace(/\^1/g, '');
    const cases = [...g.querySelectorAll('input')];
    const divs = cases.map(e => +e.dataset.x).sort((a, b) => a - b), donnes = (Q[2].querySelector('input').value.match(/\d+/g) || []).map(Number);
    const ok = [nrm(Q[0].querySelector('input').value) === nrm(v.deco), cases.every(e => +e.value === +e.dataset.x), donnes.length === divs.length && donnes.every((x, k) => x === divs[k])];
    ok.forEach((b, k) => { Q[k].classList.toggle('juste', b); Q[k].classList.toggle('faux', !b); });
    const nb = ok.filter(Boolean).length, V2 = S.querySelector('.verdict'); V2.hidden = false;
    V2.className = 'verdict ' + (nb === 3 ? 'ok' : 'non');
    V2.textContent = nb === 3 ? 'Bravo, tout est juste ! Regarde la correction pas à pas.' : `${nb} réponse${nb > 1 ? 's' : ''} juste${nb > 1 ? 's' : ''} sur 3. Regarde la correction pas à pas.`;
    et = [
      { q: 'a', h: `<p>Divisions successives :</p>${divsucc(v.n)}<p class="cc">La décomposition de ${v.n} en produit de facteurs premiers est ${v.deco}.</p>` },
      { q: 'b', h: `<p>Chaque case = ligne × colonne.</p>${tab(v, true)}<p class="cc">Le tableau donne tous les diviseurs de ${v.n}.</p>` },
      { q: 'c', h: `<p class="cc">Les diviseurs de ${v.n} sont ${divs.join(' ; ')}.</p>` }];
    S.querySelector('.fin-cc').textContent = `${v.n} a ${divs.length} diviseurs.`;
    C.hidden = false; pi = 0; montrer();
    const fin = i >= V.length - 1, be = S.querySelector('.t-essai'); be.hidden = false;
    be.textContent = fin ? 'Plus de nouvel essai pour cet exercice : passe au suivant !' : `Nouvel essai, avec un autre nombre (encore ${V.length - 1 - i})`; be.disabled = fin;
  };
  S.querySelector('.t-essai').onclick = () => { if (i < V.length - 1) { i++; charger(); S.scrollIntoView({ behavior: 'smooth' }); } };
  charger();
});
// --- méthodes (pas à pas)
E.items.forEach((it, n) => {
  if (it.type !== 'methode') return;
  const S = $('ex' + n), pas = S.querySelector('.pas'), ps = S.querySelector('.pas-suiv'); let pi = 0;
  const montrer = () => { pas.innerHTML = pasHtml(it.etapes, pi); labelSuiv(ps, it.etapes, pi); S.querySelector('.cc').hidden = pi < it.etapes.length - 1; };
  ps.onclick = () => { if (pi < it.etapes.length - 1) { pi++; montrer(); jouer(voixDe(it.etapes[pi])); } };
  S.querySelector('.pas-son').onclick = () => jouer(voixDe(it.etapes[pi]));
  montrer();
});
// --- exercices guidés (courts) : la question en cours reste sous l'image ;
// quand la réponse est juste, l'image fait l'étape de la correction et la question descend dans la liste « déjà fait ».
E.items.forEach((it, n) => {
  if (it.type !== 'guide') return;
  const S = $('ex' + n), zp = S.querySelector('.guide-pot'), za = S.querySelector('.guide-actuelle'), zf = S.querySelector('.guide-faites');
  const visuel = (k) => it.vis ? it.vis[Math.min(k, it.vis.length - 1)] : potence(it.pot[0], it.pot[1], k);
  zp.innerHTML = visuel(0);
  const etape = (i) => {
    const e = it.etapes[i], id = `g${n}_${i}`;
    // une étape est soit une réponse à taper, soit un choix (boutons)
    const champ = e.choix
      ? `<div class="choix g-choix">${e.choix.map(o => `<button class="opt" data-o="${o}">${o}</button>`).join('')}</div>`
      : `<div class="g-ligne"><input type="text" id="${id}" class="${e.touches || e.texte ? '' : 'court'}" autocomplete="off" ${e.touches || e.texte ? '' : 'inputmode="numeric"'} placeholder="${e.place || ''}"><button class="btn verif g-ok">OK</button></div>`;
    za.innerHTML = `<div class="g-etape question" data-touches="${(e.touches || []).join(' ')}">
      <label class="lab" ${e.choix ? '' : `for="${id}"`}><span class="g-num">${i + 1}</span> ${e.q}</label>
      ${champ}
      <p class="g-msg" hidden></p></div>`;
    const inp = za.querySelector('input'), msg = za.querySelector('.g-msg'); let essais = 0;
    const valider = (val) => {
      const j = juger(e.rep, val);
      if (j.rappel) { msg.hidden = false; msg.className = 'g-msg g-rappel'; msg.textContent = j.rappel; return; }
      msg.className = 'g-msg';
      if (j !== 'ok') {
        essais++; za.firstElementChild.classList.add('faux'); msg.hidden = false;
        msg.textContent = essais === 1 ? 'Pas tout à fait, réessaie.' : 'Coup de pouce : ' + e.aide; return;
      }
      zp.innerHTML = visuel(e.k);
      zp.classList.remove('anime'); void zp.offsetWidth; zp.classList.add('anime');
      zf.insertAdjacentHTML('beforeend', `<p class="g-fait"><span class="g-num">${i + 1}</span> ${e.q} <strong>${val.trim()}</strong> ✓</p>`);
      zf.hidden = false;
      if (i < it.etapes.length - 1) { etape(i + 1); const x = za.querySelector('input'); if (x) x.focus({ preventScroll: true }); }
      else { za.innerHTML = it.fin; S.querySelector('.cc').hidden = false; }
    };
    if (e.choix) za.querySelectorAll('.g-choix .opt').forEach(b => b.onclick = () => valider(b.dataset.o));
    else {
      za.querySelector('.g-ok').onclick = () => valider(inp.value);
      inp.addEventListener('keydown', ev => { if (ev.key === 'Enter') valider(inp.value); });
    }
  };
  etape(0);
});
// --- leçon : les diapos dans l'onglet Leçon, et la vidéo de la partie
E.items.forEach((it, n) => {
  if (it.type !== 'lecon') return;
  const S = $('ex' + n), box = S.querySelector('.lecteur-lecon');
  const charger = (l) => lecteurDiapos(box, LECONS[cid][l], jouer, () => son.pause());
  charger(it.parties[0]);
  S.querySelectorAll('.choix-lecon .opt').forEach(b => b.onclick = () => {
    S.querySelectorAll('.choix-lecon .opt').forEach(x => x.classList.toggle('choisi', x === b)); son.pause(); charger(b.dataset.l);
  });
  const v = (chapitre(cid).videos || [])[pid - 1], dv = S.querySelector('.video-partie');
  dv.addEventListener('toggle', () => {
    if (!dv.open) { dv.querySelector('.lecteur').innerHTML = ''; return; }
    dv.querySelector('.lecteur').innerHTML = v && v.id
      ? `<iframe src="https://www.youtube-nocookie.com/embed/${v.id}?rel=0" title="${v.titre}" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen></iframe>`
      : `<p class="sous" style="text-align:left;margin:8px 4px">Cette vidéo arrive bientôt sur la chaîne.</p>`;
  });
});
// --- vrais blocs Scratch
if (window.scratchblocks) scratchblocks.renderMatching('pre.blocks', { style: 'scratch3', languages: ['fr', 'en'], scale: window.innerWidth < 500 ? 0.68 : 0.85 });
// --- un exercice à la fois dans une rubrique, avec les flèches
document.querySelectorAll('.rubrique').forEach(R => {
  const its = [...R.querySelectorAll(':scope > .item')];
  if (its.length < 2) return;
  let k = 0;
  R.insertAdjacentHTML('beforeend', `<div class="ds-nav item-nav"><button class="btn rond" aria-label="Exercice précédent">◀</button><span></span><button class="btn rond plein" aria-label="Exercice suivant">▶</button></div>`);
  const [bp, pos, bs] = R.querySelector('.item-nav').children;
  const voir = () => { its.forEach((x, j) => x.hidden = j !== k); pos.textContent = `${k + 1} / ${its.length}`; bp.disabled = k === 0; bs.disabled = k === its.length - 1; son.pause(); };
  bp.onclick = () => { if (k > 0) { k--; voir(); window.scrollTo({ top: 0 }); } };
  bs.onclick = () => { if (k < its.length - 1) { k++; voir(); window.scrollTo({ top: 0 }); } };
  voir();
});
// --- onglets : une seule rubrique visible à la fois
const NOMS = Object.fromEntries(RUBRIQUES.map(([r, nom, ico]) => [r, ico + ' ' + nom]));
const ouvrir = (r) => {
  if (!$('r-' + r)) r = 'menu';
  $('barre').hidden = r === 'menu'; $('nomRub').textContent = NOMS[r] || '';
  document.querySelectorAll('.rubrique').forEach(x => x.hidden = x.id !== 'r-' + r);
  son.pause();
};
$('retourSom').onclick = () => { history.replaceState(null, '', location.pathname + location.search); ouvrir('menu'); window.scrollTo({ top: 0 }); };
document.querySelectorAll('.carte-rub').forEach(b => b.onclick = () => { history.replaceState(null, '', '#' + b.dataset.r); ouvrir(b.dataset.r); window.scrollTo({ top: 0 }); });
ouvrir(location.hash.slice(1) || 'menu');
</script>
