<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leçon – Une myriade de maths</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body class="fond-lecon">
<header class="entete">
  <div class="page" style="padding-bottom:0">
    <a id="retour" href="chapitre.html">← Le chapitre</a>
    <small id="niv">LEÇON</small>
    <h1 id="titre"></h1>
  </div>
</header>
<div class="page">
  <div class="diapo" id="diapo" tabindex="0" aria-live="polite">
    <div class="diapo-haut"><span id="dtitre"></span><span id="compteur"></span></div>
    <div class="diapo-corps" id="corps"></div>
    <p class="astuce" id="astuce">Clique sur la diapo pour avancer</p>
  </div>
  <div class="barre-lecon">
    <button class="btn rond" id="prec" aria-label="Revenir en arrière">◀</button>
    <button class="btn son" id="ecoute" aria-label="Écouter"><span aria-hidden="true">🔊</span> Écouter</button>
    <button class="btn rond plein" id="suiv" aria-label="Avancer">▶</button>
  </div>
  <label class="auto"><input type="checkbox" id="auto"> Lire à voix haute à chaque clic</label>
  <div class="suite" id="suite" hidden></div>
</div>
<script src="assets/data.js"></script>
<script src="assets/lecons.js"></script>
<script src="assets/audio.js"></script>
<script>
const P = new URLSearchParams(location.search), cid = P.get('c') || 'arithmetique', pid = P.get('p') || 'A';
const L = LECONS[cid][pid], ch = chapitre(cid);
const $ = (x) => document.getElementById(x);
$('titre').textContent = 'Partie ' + pid + ' · ' + L.titre;
$('niv').textContent = 'LEÇON · ' + ch.titre.toUpperCase();
$('retour').href = 'chapitre.html?c=' + cid;
document.title = L.titre + ' – Une myriade de maths';
let di = 0, ei = 0; const son = new Audio();
try { $('auto').checked = localStorage.getItem('lecon-auto') === '1'; } catch (e) {}
$('auto').onchange = () => { try { localStorage.setItem('lecon-auto', $('auto').checked ? '1' : '0'); } catch (e) {} };

function rendu(h) {
  if (typeof h === 'string') return h;
  return potence(...h.pot) + (h.apres || '');
}
function afficher() {
  const D = L.diapos[di];
  $('dtitre').textContent = D.titre;
  $('compteur').textContent = (di + 1) + ' / ' + L.diapos.length;
  $('diapo').className = 'diapo' + (D.cadre ? ' cadre' : '') + (D.alerte ? ' alerte' : '');
  // les étapes « pot » remplacent la précédente ; les autres s'ajoutent
  let html = '';
  for (let j = 0; j <= ei; j++) {
    const h = D.etapes[j].h;
    if (typeof h === 'string') html += `<div class="etape${j === ei ? ' nouvelle' : ''}">${h}</div>`;
    else if (j === ei || typeof D.etapes[j + 1].h === 'string') html += `<div class="etape pot">${rendu(h)}</div>`;
  }
  $('corps').innerHTML = html;
  const fin = di === L.diapos.length - 1 && ei === D.etapes.length - 1;
  $('suiv').disabled = fin; $('prec').disabled = di === 0 && ei === 0;
  $('astuce').hidden = !(di === 0 && ei === 0);
  $('suite').hidden = !fin;
}
function ecouter() {
  const t = L.diapos[di].etapes[ei].v, f = AUDIO[t];
  if (!f) return;
  son.pause(); son.src = 'audio/' + f; son.play().catch(() => {});
}
function avancer() {
  const D = L.diapos[di];
  if (ei < D.etapes.length - 1) ei++;
  else if (di < L.diapos.length - 1) { di++; ei = 0; }
  else return;
  afficher(); if ($('auto').checked) ecouter(); else son.pause();
}
function reculer() {
  if (ei > 0) ei--;
  else if (di > 0) { di--; ei = L.diapos[di].etapes.length - 1; }
  son.pause(); afficher();
}
$('suiv').onclick = avancer; $('prec').onclick = reculer; $('ecoute').onclick = ecouter;
$('diapo').onclick = avancer;
document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === ' ') { e.preventDefault(); avancer(); }
  if (e.key === 'ArrowLeft') reculer();
});
const lettres = Object.keys(LECONS[cid]), k = lettres.indexOf(pid);
$('suite').innerHTML = (k < lettres.length - 1
  ? `<a class="ligne" href="lecon.html?c=${cid}&p=${lettres[k + 1]}"><span>Partie suivante : ${LECONS[cid][lettres[k + 1]].titre}</span><span class="fl">→</span></a>` : '')
  + `<a class="ligne" href="exercices.html?c=${cid}&p=1"><span>S’entraîner : les exercices</span><span class="fl">→</span></a>`;
afficher();
</script>
</body>
</html>
