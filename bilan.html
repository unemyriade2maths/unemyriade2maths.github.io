<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="index, follow, noai, noimageai">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fin de chapitre – Une myriade de maths</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="entete">
  <div class="page" style="padding-bottom:0">
    <a id="retour" href="chapitre.html">← Le chapitre</a>
    <small id="niv">FIN DE CHAPITRE</small>
    <h1 id="titre"></h1>
  </div>
</header>
<div class="page" id="zone"></div>
<script src="assets/data.js"></script>
<script src="assets/lecons.js"></script>
<script src="assets/bilans.js"></script>
<script>
const P = new URLSearchParams(location.search), cid = P.get('c') || 'arithmetique', t = P.get('t') || 'qcm';
const B = BILANS[cid], ch = chapitre(cid), $ = (x) => document.getElementById(x), Z = $('zone');
$('retour').href = 'chapitre.html?c=' + cid; $('niv').textContent = 'FIN DE CHAPITRE · ' + ch.titre.toUpperCase();

if (t === 'qcm') {
  $('titre').textContent = 'QCM de fin de chapitre'; document.title = 'QCM – ' + ch.titre;
  Z.innerHTML = `<p class="consigne" style="margin-top:18px">Pour chaque question, choisis la bonne réponse, puis valide à la fin.</p>
    ${B.qcm.map((x, i) => `<div class="qcm" data-i="${i}"><p class="qcm-q"><span class="g-num">${i + 1}</span> ${x.q}</p>
      <div class="choix">${x.o.map((o, j) => `<button class="opt" data-j="${j}">${o}</button>`).join('')}</div><div class="qcm-corr" hidden></div></div>`).join('')}
    <button class="btn verif large" id="valider">Valider mes réponses</button><div id="score"></div>`;
  Z.querySelectorAll('.qcm').forEach(q => q.querySelectorAll('.opt').forEach(o => o.onclick = () => {
    if (q.classList.contains('fini')) return;
    q.querySelectorAll('.opt').forEach(x => x.classList.remove('choisi')); o.classList.add('choisi');
  }));
  $('valider').onclick = () => {
    let s = 0;
    Z.querySelectorAll('.qcm').forEach(q => {
      const x = B.qcm[q.dataset.i], c = q.querySelector('.opt.choisi'), ok = c && +c.dataset.j === x.r; if (ok) s++;
      q.classList.add('fini', ok ? 'juste' : 'faux');
      q.querySelectorAll('.opt')[x.r].classList.add('bonne');
      const C = q.querySelector('.qcm-corr'); C.hidden = false;
      C.innerHTML = `<p><strong>${ok ? 'Juste !' : 'La bonne réponse : ' + x.o[x.r]}</strong></p><div class="lignes">${x.e}</div><p class="cc">${x.cc}</p>`;
    });
    $('valider').hidden = true;
    $('score').innerHTML = `<div class="verdict ${s >= 7 ? 'ok' : 'non'}">Ton score : ${s} / ${B.qcm.length}. ${s >= 7 ? 'Bravo, tu es prêt pour le DS !' : 'Revois les parties où tu t’es trompé, puis recommence.'}</div>
      <button class="btn essai" onclick="location.reload()">Recommencer le QCM</button>`;
    $('score').scrollIntoView({ behavior: 'smooth' });
  };
} else {
  const D = B.ds, Q = [];
  D.exos.forEach((e, i) => e.corr.forEach(c => Q.push({ e, i, c })));
  const total = Q.length * 2, virg = (x) => String(x).replace('.', ',');
  $('titre').textContent = 'Simulation du DS'; document.title = 'Simulation du DS – ' + ch.titre;
  Z.innerHTML = `<div class="ds-debut" id="debut"><h2>${D.titre}</h2><p>Durée : <strong>${D.duree} minutes</strong>.</p><div class="rappel">${D.consigne}</div>
      <p>Prends une feuille et ton crayon. Quand tu cliques sur « Commencer », le chrono démarre. À la fin, tu corriges ta copie question par question.</p>
      <button class="btn verif large" id="go">Commencer le DS</button></div>
    <div id="sujet" hidden><div class="ds-chrono" id="chrono"></div><div id="page"></div>
      <div class="ds-nav"><button class="btn rond" id="prec" aria-label="Précédent">◀</button><span id="pos"></span><button class="btn rond plein" id="suiv" aria-label="Suivant">▶</button></div>
      <button class="btn verif large" id="fin">Fin : je rends ma copie</button></div>`;
  let mode = 'sujet', k = 0, fin = 0, tm = null;
  const pts = Q.map(() => [false, false, false]);
  const PT = [1, 0.5, 0.5], NOM = ['Calcul', 'Réponse', 'Phrase réponse'];
  const somme = () => pts.reduce((a, p) => a + p.reduce((b, x, j) => b + (x ? PT[j] : 0), 0), 0);
  const montrer = () => {
    const P = $('page');
    if (mode === 'sujet') {
      const e = D.exos[k];
      P.innerHTML = `<div class="rappel petit-rappel">Justifie chaque calcul.</div><h3 class="exo-titre">${e.titre} <span class="ceinture">${virg(e.corr.length * 2)} points</span></h3><div class="enonce">${e.enonce}</div>`;
      $('pos').textContent = `Exercice ${k + 1} / ${D.exos.length}`; $('prec').disabled = k === 0; $('suiv').disabled = k === D.exos.length - 1;
    } else if (mode === 'corr') {
      const { e, c } = Q[k];
      P.innerHTML = `<h3 class="exo-titre">${e.titre} · question ${c.q}</h3>
        <details class="revoir"><summary>Revoir l’énoncé</summary><div class="enonce">${e.enonce}</div></details>
        ${[c.calc, c.rep, `<p class="cc">${c.phrase}</p>`].map((h, j) => `<div class="ds-ligne"><span class="ds-tag">${NOM[j]}</span><div class="lignes">${h}</div>
          <label class="ds-pt"><input type="checkbox" data-j="${j}" ${pts[k][j] ? 'checked' : ''}> ${virg(PT[j])} pt</label></div>`).join('')}
        <p class="ds-total">Tes points pour l’instant : ${virg(somme())} / ${total}</p>`;
      P.querySelectorAll('.ds-pt input').forEach(x => x.onchange = () => { pts[k][+x.dataset.j] = x.checked; P.querySelector('.ds-total').textContent = `Tes points pour l’instant : ${virg(somme())} / ${total}`; });
      $('pos').textContent = `Question ${k + 1} / ${Q.length}`; $('prec').disabled = k === 0; $('suiv').disabled = k === Q.length - 1;
    }
    window.scrollTo({ top: 0 });
  };
  const tic = () => {
    const r = Math.max(0, fin - Date.now()), m = Math.floor(r / 60000), s = Math.floor(r / 1000) % 60;
    $('chrono').textContent = `⏱ ${m} min ${String(s).padStart(2, '0')} s`;
    $('chrono').classList.toggle('presque', r < 5 * 60000);
    if (r === 0) { clearInterval(tm); $('chrono').textContent = '⏱ Temps écoulé : pose ton crayon !'; }
  };
  $('go').onclick = () => { $('debut').hidden = true; $('sujet').hidden = false; fin = Date.now() + D.duree * 60000; tic(); tm = setInterval(tic, 1000); montrer(); };
  $('prec').onclick = () => { if (k > 0) { k--; montrer(); } };
  $('suiv').onclick = () => { k++; montrer(); };
  $('fin').onclick = () => {
    if (mode === 'sujet') {
      clearInterval(tm); mode = 'corr'; k = 0; $('chrono').textContent = 'Copie rendue : corrige-toi question par question.';
      $('fin').textContent = 'Fin : voir ma note'; montrer();
    } else {
      const n = somme(), sur20 = Math.round(n / total * 40) / 2;
      mode = 'note'; document.querySelector('.ds-nav').hidden = true; $('fin').hidden = true; $('chrono').textContent = 'Correction terminée';
      $('page').innerHTML = `<div class="verdict ${sur20 >= 10 ? 'ok' : 'non'}">Ta note : ${virg(sur20)} / 20 &nbsp;(${virg(n)} points sur ${total})</div>
        <table class="tableau"><tr><th>Question</th><th>Points</th></tr>${Q.map((q, i) => `<tr><td>${q.e.titre} · ${q.c.q}</td><td>${virg(pts[i].reduce((b, x, j) => b + (x ? PT[j] : 0), 0))} / 2</td></tr>`).join('')}</table>
        <button class="btn essai" id="revoir">Revoir la correction</button>`;
      $('revoir').onclick = () => { mode = 'corr'; k = 0; document.querySelector('.ds-nav').hidden = false; $('fin').hidden = false; montrer(); };
    }
  };
}
</script>

</body>
</html>
