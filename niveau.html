<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Une myriade de maths – Ma classe</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<div class="page">
  <div class="haut"><a id="retour" href="index.html" style="font-weight:800;text-decoration:none;min-height:44px;display:inline-flex;align-items:center">← Accueil</a></div>
  <header class="logo" style="padding-top:4px">
    <p>Une myriade de <span>maths</span></p>
    <div class="trait"></div>
  </header>
  <p class="sous" id="sous"></p>
  <main id="contenu"></main>
</div>
<script src="assets/data.js"></script>
<script>
const k = new URLSearchParams(location.search).get('n') || '3e';
const n = NIVEAUX[k] || NIVEAUX['3e'];
document.getElementById('sous').textContent = ESPACES[n.espace] + ' · ' + n.nom;

document.title = 'Une myriade de maths – ' + n.nom;
const prog = PROGRESSION[k] || [];
const idx = prog.findIndex(x => x.id === n.enCours);
const cur = n.enCours ? chapitre(n.enCours) : null;
const prec = idx > 0 ? prog[idx - 1] : null, suiv = idx >= 0 && idx < prog.length - 1 ? prog[idx + 1] : null;
let h = '';
if (cur) {
  h += `<a class="carte-chap" href="chapitre.html?c=${n.enCours}">
    <span class="pastille">Chapitre en cours</span><h2>${cur.titre}</h2><p>${cur.resume}</p><p class="go">Ouvrir le chapitre →</p></a>`;
} else {
  h += `<div class="carte-chap"><span class="pastille">Bientôt</span><h2>Les chapitres arrivent bientôt</h2><p>En attendant, retrouve les vidéos sur la chaîne.</p></div>`;
}
if (prec || suiv) {
  h += '<div class="voisins">';
  h += prec ? `<a class="carte-prec" href="chapitre.html?c=${prec.id}"><span><small>← Chapitre précédent</small><strong>${prec.titre}</strong></span></a>` : '<span></span>';
  h += suiv ? `<a class="carte-prec suiv" href="chapitre.html?c=${suiv.id}"><span><small>Chapitre suivant →</small><strong>${suiv.titre}</strong></span></a>` : '<span></span>';
  h += '</div>';
}
if (prog.length) {
  h += '<section class="bloc"><h3>Tous les chapitres de l’année</h3>';
  let per = 0;
  prog.forEach((x, i) => {
    if (x.periode !== per) { per = x.periode; h += `<p class="periode">Période ${per}</p>`; }
    const etat = i < idx ? '<span class="badge ok">Fait</span>' : (i === idx ? '<span class="badge todo">En cours</span>' : '');
    h += `<a class="ligne${i === idx ? ' actuel' : ''}" href="chapitre.html?c=${x.id}"><span><span class="num">${i + 1}</span> ${x.titre}</span>${etat}</a>`;
  });
  h += '</section>';
}
h += `<section class="bloc"><h3>Les vidéos</h3><a class="ligne" href="${CHAINE}"><span>La chaîne Une myriade de maths</span><span class="fl">▶</span></a></section>`;
document.getElementById('contenu').innerHTML = h;
</script>
</body>
</html>
